                info.classList.add('show');
            } else {
                alert('海拔查询失败，请检查网络连接');
            }
            btn.disabled = false;
            btn.textContent = '🔄 校准海拔';
        });

        document.getElementById('gcj02-toggle').addEventListener('click', () => {
            if (!state.gpxData) return;
            const result = parseGpx(state.gpxData);
            if (!result) return;
            const shouldConvert = !state.gcj02Converted;
            if (shouldConvert) {
                result.points.forEach(p => {
                    const [lat, lon] = gcj02ToWgs84(p.lat, p.lon);
                    p.lat = lat; p.lon = lon;
                });
            }
            state.gcj02Converted = shouldConvert;
            state.rawPoints = result.points;
            updateWithFilter();
            const btn = document.getElementById('gcj02-toggle');
            btn.classList.toggle('active', shouldConvert);
        });

        document.getElementById('stat-duration-card').addEventListener('click', async function() {
            const current = state.avgSpeed || 25;
            const val = await showModal('设置平均速度', current, '范围 5-60 km/h，用于计算预估时长');
            if (val === null) return;
            const speed = parseInt(val);
            if (isNaN(speed) || speed < 5 || speed > 60) { alert('请输入 5-60 之间的数值'); return; }
            state.avgSpeed = speed;
            document.getElementById('speed-display').textContent = speed;
            if (state.gpxPoints.length > 0) updateStats({
                totalDistance: state.totalDistance,
                totalElevationGain: state.totalElevationGain
            });
        });

        document.getElementById('stat-poi-card').addEventListener('click', () => {
            const list = document.getElementById('poi-modal-list');
            if (pois.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:var(--text-muted);padding:24px 0;font-size:0.88em;">暂无兴趣点</div>';
            } else {
                list.innerHTML = pois.map((p, i) => {
                    const info = POI_TYPES[p.type];
                    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:6px;">
                        <span style="font-size:1.3em;">${info.emoji}</span>
                        <div style="flex:1;min-width:0;">
                            <div class="poi-modal-name" data-idx="${i}" style="font-size:0.88em;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border-bottom:1px dashed transparent;transition:border-color 0.2s;">${p.name}</div>
                            <div style="font-size:0.75em;color:var(--text-muted);">${p.lat.toFixed(6)}, ${p.lng.toFixed(6)}</div>
                        </div>
                        <button class="poi-locate-btn" data-lat="${p.lat}" data-lng="${p.lng}" style="padding:4px 10px;border-radius:6px;border:1px solid var(--border);background:var(--card);font-size:0.78em;cursor:pointer;white-space:nowrap;">定位</button>
                    </div>`;
                }).join('');
            }
            document.getElementById('poi-modal-overlay').classList.add('show');
        });
        document.getElementById('poi-modal-overlay').addEventListener('click', e => {
            const nameEl = e.target.closest('.poi-modal-name');
            if (nameEl) {
                renamePoi(parseInt(nameEl.dataset.idx));
                return;
            }
            const btn = e.target.closest('.poi-locate-btn');
            if (!btn) return;
            const lat = parseFloat(btn.dataset.lat);
            const lng = parseFloat(btn.dataset.lng);
            if (isNaN(lat) || isNaN(lng)) return;
            document.getElementById('poi-modal-overlay').classList.remove('show');
            state.map.setView([lat, lng], 16);
        });
        document.getElementById('poi-modal-close').addEventListener('click', () => {
            document.getElementById('poi-modal-overlay').classList.remove('show');
        });
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();
</script>
</body>
</html>
